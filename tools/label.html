<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>Keyframe Labeler</title>
<style>
:root{--bg:#111;--fg:#eee;--mut:#999;--acc:#ffd400}
body{margin:0;background:var(--bg);color:var(--fg);font:14px -apple-system,system-ui,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid #333;flex-wrap:wrap}
button{background:#222;color:var(--fg);border:1px solid #444;border-radius:6px;padding:6px 12px;cursor:pointer}
button.primary{background:var(--acc);color:#000;border-color:var(--acc)}
#wrap{position:relative;margin:16px auto;max-width:1280px}
canvas{width:100%;display:block;cursor:crosshair}
.mut{color:var(--mut)} kbd{background:#333;border-radius:4px;padding:1px 5px}
</style></head><body>
<header>
 <strong id="title"></strong><span id="meta" class="mut"></span>
 <span style="flex:1"></span>
 <button id="prev">← Prev</button><button id="next">Next →</button>
 <button id="clear">Clear</button><button class="primary" id="export">Export labels.json</button>
</header>
<p class="mut" style="padding:0 16px">Drag a box around the <b>must-keep region</b>: ball + players directly involved (live play), or the main person's face and upper body (close-up). Skip logos and scoreboards. <kbd>←</kbd>/<kbd>→</kbd> to navigate. Progress autosaves in this browser. Then put the exported file at <code>samples/football-keyframes/labels.json</code>.</p>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
const FRAMES = [{"id": "el-clasico_01_wide_01-12-30", "src": "../samples/football-keyframes/frames/el-clasico_01_wide_01-12-30.jpg", "cat": "wide", "note": "禁区附近的主机位全景", "W": 1280, "H": 720}, {"id": "el-clasico_02_wide_01-20-00", "src": "../samples/football-keyframes/frames/el-clasico_02_wide_01-20-00.jpg", "cat": "wide", "note": "中场推进，多名球员与场地空间", "W": 1280, "H": 720}, {"id": "el-clasico_03_replay_01-22-10", "src": "../samples/football-keyframes/frames/el-clasico_03_replay_01-22-10.jpg", "cat": "replay", "note": "进球后的门后角度回放", "W": 1280, "H": 720}, {"id": "el-clasico_04_replay_01-22-20", "src": "../samples/football-keyframes/frames/el-clasico_04_replay_01-22-20.jpg", "cat": "replay", "note": "进球回放中的门将扑救", "W": 1280, "H": 720}, {"id": "el-clasico_05_closeup_01-22-40", "src": "../samples/football-keyframes/frames/el-clasico_05_closeup_01-22-40.jpg", "cat": "closeup", "note": "巴萨球员拥抱庆祝", "W": 1280, "H": 720}, {"id": "el-clasico_06_wide_01-23-30", "src": "../samples/football-keyframes/frames/el-clasico_06_wide_01-23-30.jpg", "cat": "wide", "note": "皇马禁区前组织，主机位远景", "W": 1280, "H": 720}, {"id": "el-clasico_07_closeup_01-26-40", "src": "../samples/football-keyframes/frames/el-clasico_07_closeup_01-26-40.jpg", "cat": "closeup", "note": "拉莫斯与裁判附近的人物特写", "W": 1280, "H": 720}, {"id": "el-clasico_08_closeup_01-33-40", "src": "../samples/football-keyframes/frames/el-clasico_08_closeup_01-33-40.jpg", "cat": "closeup", "note": "巴萨教练场边特写", "W": 1280, "H": 720}, {"id": "el-clasico_09_wide_01-34-00", "src": "../samples/football-keyframes/frames/el-clasico_09_wide_01-34-00.jpg", "cat": "wide", "note": "皇马边路进攻与禁区站位", "W": 1280, "H": 720}, {"id": "el-clasico_10_closeup_01-34-20", "src": "../samples/football-keyframes/frames/el-clasico_10_closeup_01-34-20.jpg", "cat": "closeup", "note": "梅西人物特写", "W": 1280, "H": 720}, {"id": "el-clasico_11_replay_01-35-00", "src": "../samples/football-keyframes/frames/el-clasico_11_replay_01-35-00.jpg", "cat": "replay", "note": "进球后的边路低机位回放", "W": 1280, "H": 720}, {"id": "el-clasico_12_wide_01-41-00", "src": "../samples/football-keyframes/frames/el-clasico_12_wide_01-41-00.jpg", "cat": "wide", "note": "巴萨终场前禁区进攻的主机位画面", "W": 1280, "H": 720}, {"id": "el-clasico_13_closeup_01-41-20", "src": "../samples/football-keyframes/frames/el-clasico_13_closeup_01-41-20.jpg", "cat": "closeup", "note": "皇马球员反应特写", "W": 1280, "H": 720}, {"id": "el-clasico_14_replay_01-41-50", "src": "../samples/football-keyframes/frames/el-clasico_14_replay_01-41-50.jpg", "cat": "replay", "note": "终场前进球后的推进回放", "W": 1280, "H": 720}, {"id": "el-clasico_15_replay_01-42-20", "src": "../samples/football-keyframes/frames/el-clasico_15_replay_01-42-20.jpg", "cat": "replay", "note": "终场前进球的门后角度回放", "W": 1280, "H": 720}, {"id": "belgium-japan_01_closeup_01-13-20", "src": "../samples/football-keyframes/frames/belgium-japan_01_closeup_01-13-20.jpg", "cat": "closeup", "note": "日本队教练场边特写", "W": 1280, "H": 720}, {"id": "belgium-japan_02_closeup_01-14-00", "src": "../samples/football-keyframes/frames/belgium-japan_02_closeup_01-14-00.jpg", "cat": "closeup", "note": "费莱尼人物特写", "W": 1280, "H": 720}, {"id": "belgium-japan_03_wide_01-14-20", "src": "../samples/football-keyframes/frames/belgium-japan_03_wide_01-14-20.jpg", "cat": "wide", "note": "比利时禁区进攻与日本防守站位", "W": 1280, "H": 720}, {"id": "belgium-japan_04_replay_01-15-00", "src": "../samples/football-keyframes/frames/belgium-japan_04_replay_01-15-00.jpg", "cat": "replay", "note": "比利时进球后的门前回放", "W": 1280, "H": 720}, {"id": "belgium-japan_05_closeup_01-19-00", "src": "../samples/football-keyframes/frames/belgium-japan_05_closeup_01-19-00.jpg", "cat": "closeup", "note": "比利时球迷庆祝特写", "W": 1280, "H": 720}, {"id": "belgium-japan_06_replay_01-19-20", "src": "../samples/football-keyframes/frames/belgium-japan_06_replay_01-19-20.jpg", "cat": "replay", "note": "扳平进球后的高位全景回放", "W": 1280, "H": 720}, {"id": "belgium-japan_07_wide_01-20-20", "src": "../samples/football-keyframes/frames/belgium-japan_07_wide_01-20-20.jpg", "cat": "wide", "note": "日本进攻与比利时防守的主机位远景", "W": 1280, "H": 720}, {"id": "belgium-japan_08_wide_01-30-00", "src": "../samples/football-keyframes/frames/belgium-japan_08_wide_01-30-00.jpg", "cat": "wide", "note": "中场持球与整体站位", "W": 1280, "H": 720}, {"id": "belgium-japan_09_closeup_01-38-00", "src": "../samples/football-keyframes/frames/belgium-japan_09_closeup_01-38-00.jpg", "cat": "closeup", "note": "比利时门将特写", "W": 1280, "H": 720}, {"id": "belgium-japan_10_replay_01-38-40", "src": "../samples/football-keyframes/frames/belgium-japan_10_replay_01-38-40.jpg", "cat": "replay", "note": "日本射门后的门前角度回放", "W": 1280, "H": 720}, {"id": "belgium-japan_11_wide_01-39-08", "src": "../samples/football-keyframes/frames/belgium-japan_11_wide_01-39-08.jpg", "cat": "wide", "note": "终场前反击：中场推进", "W": 1280, "H": 720}, {"id": "belgium-japan_12_wide_01-39-12", "src": "../samples/football-keyframes/frames/belgium-japan_12_wide_01-39-12.jpg", "cat": "wide", "note": "终场前反击：右路进入禁区前沿", "W": 1280, "H": 720}, {"id": "belgium-japan_13_closeup_01-39-40", "src": "../samples/football-keyframes/frames/belgium-japan_13_closeup_01-39-40.jpg", "cat": "closeup", "note": "日本球员低头反应特写", "W": 1280, "H": 720}, {"id": "belgium-japan_14_replay_01-40-00", "src": "../samples/football-keyframes/frames/belgium-japan_14_replay_01-40-00.jpg", "cat": "replay", "note": "绝杀进球后的高位反击回放", "W": 1280, "H": 720}, {"id": "belgium-japan_15_replay_01-40-20", "src": "../samples/football-keyframes/frames/belgium-japan_15_replay_01-40-20.jpg", "cat": "replay", "note": "绝杀进球后的门内角度回放", "W": 1280, "H": 720}];
let labels = {}; try { labels = JSON.parse(localStorage.getItem('kf_labels') || '{}'); } catch(e) {}
let i = 0, img = new Image(), drag = null;
const c = document.getElementById('c'), ctx = c.getContext('2d');
function save(){ try { localStorage.setItem('kf_labels', JSON.stringify(labels)); } catch(e) {} }
function load(){ const f = FRAMES[i]; img = new Image(); img.onload = draw; img.src = f.src;
  document.getElementById('title').textContent = `${i+1}/${FRAMES.length} ${f.id}`;
  document.getElementById('meta').textContent = `${f.cat} · ${f.note} · labeled ${Object.keys(labels).length}/${FRAMES.length}`; }
function draw(){ c.width = img.naturalWidth; c.height = img.naturalHeight; ctx.drawImage(img,0,0);
  const r = drag || (labels[FRAMES[i].id]||{}).region; if (!r) return;
  ctx.lineWidth = 4; ctx.strokeStyle = '#ffd400'; ctx.strokeRect(r[0], r[1], r[2]-r[0], r[3]-r[1]); }
function pt(e){ const b = c.getBoundingClientRect(); return [(e.clientX-b.left)*c.width/b.width, (e.clientY-b.top)*c.height/b.height]; }
c.onmousedown = e => { const p = pt(e); drag = [p[0],p[1],p[0],p[1]]; };
c.onmousemove = e => { if (!drag) return; const p = pt(e); drag[2]=p[0]; drag[3]=p[1]; draw(); };
c.onmouseup = () => { if (!drag) return; const r = [Math.min(drag[0],drag[2]),Math.min(drag[1],drag[3]),Math.max(drag[0],drag[2]),Math.max(drag[1],drag[3])].map(Math.round);
  if (r[2]-r[0] > 8 && r[3]-r[1] > 8) labels[FRAMES[i].id] = {region: r}; drag = null; save(); load(); };
const go = d => { i = (i + d + FRAMES.length) % FRAMES.length; load(); };
document.getElementById('prev').onclick = () => go(-1); document.getElementById('next').onclick = () => go(1);
document.getElementById('clear').onclick = () => { delete labels[FRAMES[i].id]; save(); load(); };
document.onkeydown = e => { if (e.key==='ArrowRight') go(1); if (e.key==='ArrowLeft') go(-1); };
document.getElementById('export').onclick = () => { const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(labels, null, 1)], {type:'application/json'})); a.download = 'labels.json'; a.click(); };
load();
</script></body></html>
